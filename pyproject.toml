[project]
name = "todo-python-project" # TODO: replace with the distribution name
version = "0.1.0"
description = "TODO: Describe the project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TODO: Responsible team" }]
dependencies = []
# TODO: Choose and document a license before publishing.

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
